[project]
name = "channel-wise-forgetting"
version = "0.1.0"
description = "Studying channel-wise forgetting mechanisms in linear attention"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "datasets>=3.0.0",
    "tokenizers>=0.20.0",
    "transformers>=4.45.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "wandb>=0.18.0",
    "einops>=0.8.0",
]

[tool.uv]
dev-dependencies = [
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]
